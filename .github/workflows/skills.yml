name: Skills

# Two gates, both graded rather than pass/fail:
#   1. Every SKILL.md is scored 0-100 and must not regress against tests/baseline.json
#   2. Every worked example is checked against the output template its skill promises
#
# The point is not a green badge. It's that editing a skill moves a number, and the
# number is committed, so a quality regression shows up in the diff like any other bug.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    name: Score skills (loss function + regression gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/product-manager-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Broken-promise audit (paths, bundles, counts, coverage, links)
        run: |
          python3 scripts/build_targets.py > /dev/null
          python3 tests/audit.py --check

      - name: Score every skill
        run: python3 tests/run_all.py --check

      - name: Check every worked example against its output template
        run: python3 tests/check_all_artifacts.py

      - name: Confirm the worked-examples document is current
        run: python3 tests/build_sample_outputs.py --check

      - name: Confirm the committed scoreboard is current
        run: |
          python3 tests/run_all.py > /dev/null
          if ! git diff --quiet -- tests/RESULTS.md ../../README.md; then
            echo "::error::The scoreboard or the README badge is stale. Run 'python3 tests/run_all.py' and commit the result."
            git --no-pager diff -- tests/RESULTS.md ../../README.md
            exit 1
          fi

  manifest:
    name: Validate manifests and skill wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests parse
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; json.load(open('plugins/product-manager-os/.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('plugins/product-manager-os/.mcp.json'))"

      - name: Skill count in plugin.json matches what ships
        working-directory: plugins/product-manager-os
        run: |
          python3 - <<'PY'
          import json, os, re
          n = sum(1 for d in os.listdir('skills')
                  if os.path.isfile(os.path.join('skills', d, 'SKILL.md')))
          desc = json.load(open('.claude-plugin/plugin.json'))['description']
          m = re.search(r'Ships (\d+) battle-tested skills', desc)
          assert m, "plugin.json description must state 'Ships N battle-tested skills'"
          claimed = int(m.group(1))
          assert claimed == n, f"plugin.json claims {claimed} skills, {n} ship"
          print(f"OK — {n} skills, manifest agrees")
          PY

      - name: Subagents are well-formed and every reference resolves
        working-directory: plugins/product-manager-os
        run: |
          python3 - <<'PY'
          import os, re
          agents = {}
          for fn in sorted(os.listdir('agents')):
              if not fn.endswith('.md'):
                  continue
              txt = open(os.path.join('agents', fn), encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---\n(.*)$', txt, re.S)
              assert m, f"agents/{fn}: no frontmatter"
              fm = dict(re.findall(r'^(\w+):\s*(.+)$', m.group(1), re.M))
              assert fm.get('name') == fn[:-3], f"agents/{fn}: name must match filename"
              assert len(fm.get('description', '')) >= 80, f"agents/{fn}: description too thin"
              assert len(m.group(2).split()) >= 300, f"agents/{fn}: body too thin to be a real brief"
              agents[fm['name']] = 0
          # every subagent a skill references must exist, and every subagent must be used
          for d in sorted(os.listdir('skills')):
              f = os.path.join('skills', d, 'SKILL.md')
              if not os.path.isfile(f):
                  continue
              for ref in re.findall(r'`(\w+)` subagent', open(f, encoding='utf-8').read()):
                  assert ref in agents, f"skills/{d} references unknown subagent '{ref}'"
                  agents[ref] += 1
          unused = [a for a, n in agents.items() if n == 0]
          assert not unused, f"subagents defined but never referenced: {unused}"
          print("OK — " + ", ".join(f"{a} ({n} skills)" for a, n in agents.items()))
          PY

      - name: Every skill is listed in CLAUDE.md and the plugin README
        working-directory: plugins/product-manager-os
        run: |
          python3 - <<'PY'
          import os
          skills = sorted(d for d in os.listdir('skills')
                          if os.path.isfile(os.path.join('skills', d, 'SKILL.md')))
          problems = []
          for doc, why in (('CLAUDE.md', 'the model cannot reach a skill it was never told about'),
                           ('README.md', 'a skill nobody can find is a skill nobody uses')):
              text = open(doc, encoding='utf-8').read()
              missing = [s for s in skills if f'`{s}`' not in text]
              if missing:
                  problems.append(f"{doc}: missing {', '.join(missing)} — {why}")
          if problems:
              raise SystemExit("\n".join(problems))
          print(f"OK — all {len(skills)} skills appear in CLAUDE.md and README.md")
          PY

  targets:
    name: Multi-agent bundles build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build every target
        working-directory: plugins/product-manager-os
        run: python3 scripts/build_targets.py

      - name: Committed bundles match a fresh build
        run: |
          if ! git diff --quiet -- plugins/product-manager-os/dist; then
            echo "::error::dist/ is stale. Run 'python3 scripts/build_targets.py' from plugins/product-manager-os and commit."
            git --no-pager diff --stat -- plugins/product-manager-os/dist
            exit 1
          fi
          echo "dist/ is current"

      - name: Install each target and run every tool it ships
        run: |
          # The bug this catches: a script that works in the repo and dies after
          # install, because the repo layout is not the installed layout. Three
          # of the shipped tools scanned for ./skills, which doesn't exist on the
          # two hosts that use .claude/skills and .cursor/rules.
          set -e
          fails=0
          for t in claude-code claude-cowork codex cursor gemini-cli generic; do
            d="$(mktemp -d)"
            bash install.sh --target "$t" "$d" > /dev/null
            n=$(find "$d" -name SKILL.md | wc -l | tr -d ' ')
            if [ "$n" -ne 53 ]; then echo "::error::$t installed $n skills, expected 53"; fails=1; fi
            for tool in "relevance_report.py" "run_all.py" "index_workspace.py"; do
              if ! (cd "$d" && python3 "tests/$tool" > /dev/null 2>&1); then
                echo "::error::$t: tests/$tool fails after install"; fails=1
              fi
            done
            if ! (cd "$d" && python3 tests/check_artifact.py --skill write-spec --template-only > /dev/null 2>&1); then
              echo "::error::$t: tests/check_artifact.py fails after install"; fails=1
            fi
            echo "  $t: $n skills, tools OK"
            rm -rf "$d"
          done
          [ "$fails" -eq 0 ] || exit 1

      - name: The installer never clobbers a user file, and never guesses the host
        run: |
          set -e
          # A user's own top-level skills/ is the live case: the codex, gemini and
          # generic bundles all write one, and plenty of people already have theirs.
          d="$(mktemp -d)"; mkdir -p "$d/skills/write-spec"
          printf 'MY CUSTOM WRITE-SPEC\n' > "$d/skills/write-spec/SKILL.md"
          if bash install.sh --target generic "$d" > /dev/null 2>&1; then
            echo "::error::installer overwrote a colliding user file instead of refusing"; exit 1
          fi
          grep -q 'MY CUSTOM' "$d/skills/write-spec/SKILL.md" \
            || { echo "::error::user's skill was clobbered"; exit 1; }
          # refusing must write NOTHING, not stop halfway
          [ ! -f "$d/AGENTS.md" ] || { echo "::error::wrote the entry file before refusing"; exit 1; }
          # --force is the documented way through
          bash install.sh --force --target generic "$d" > /dev/null
          grep -q 'MY CUSTOM' "$d/skills/write-spec/SKILL.md" \
            && { echo "::error::--force did not overwrite"; exit 1; }

          # get.sh REFUSES to install into /tmp — that's a feature, and on Linux
          # `mktemp -d` hands you /tmp/tmp.XXXX, so these two cases must run
          # somewhere that looks like a real project directory or the test trips
          # the product's own safety guard instead of testing what it means to.
          SANDBOX="$GITHUB_WORKSPACE/../ci-installer-sandbox"
          mkdir -p "$SANDBOX"

          # Ambiguous host signals must refuse, not guess. The old detect()
          # returned the first hit with Claude ahead of Codex, so any folder that
          # had ever run Claude Code got the Claude bundle with AGENTS.md present.
          e="$SANDBOX/ambiguous"; mkdir -p "$e/.claude"; touch "$e/AGENTS.md"
          out="$( cd "$e" && PERSONA_OS_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/get.sh" 2>&1 || true )"
          case "$out" in
            *"more than one tool"*) : ;;
            *) echo "::error::ambiguous folder did not refuse"; echo "$out"; exit 1 ;;
          esac
          if [ -f "$e/CLAUDE.md" ] || [ -d "$e/skills" ]; then
            echo "::error::wrote into an ambiguous folder"; exit 1
          fi

          # An unambiguous Codex folder must resolve to codex
          f="$SANDBOX/codex"; mkdir -p "$f"; touch "$f/AGENTS.md"
          out="$( cd "$f" && PERSONA_OS_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/get.sh" 2>&1 || true )"
          case "$out" in
            *"detected: codex"*) : ;;
            *) echo "::error::AGENTS.md folder did not detect codex"; echo "$out"; exit 1 ;;
          esac

          # And the guard itself still holds. Use a literal /tmp path: `mktemp -d`
          # gives /tmp/… on Linux but /var/folders/… on macOS, so relying on it
          # makes this assertion true on one platform and false on the other.
          g="/tmp/ci-guard-check"; rm -rf "$g"; mkdir -p "$g"; touch "$g/AGENTS.md"
          out="$( cd "$g" && PERSONA_OS_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/get.sh" 2>&1 || true )"
          case "$out" in
            *"Stopped. Nothing was written"*) : ;;
            *) echo "::error::get.sh installed into a temp dir; the guard is gone"; echo "$out"; exit 1 ;;
          esac

          echo "installer refuses to clobber, refuses to guess, and refuses /tmp"
          rm -rf "$d" "$g" "$SANDBOX"

      - name: Shipped tools survive a plugin install (skills are NOT in the project)
        working-directory: plugins/product-manager-os
        run: |
          # On `/plugin install` the project gets memory/, workspace/ and tests/.
          # The skills stay in the plugin cache. Every tool here used to die on an
          # unhandled FileNotFoundError in that layout — including relevance_report.py,
          # which /tune-up runs, and run_all.py, which skill-creator points at.
          # The install.sh smoke test above cannot see this: it copies skills in.
          set -e
          d="$(mktemp -d)"
          mkdir -p "$d/tests" "$d/memory" "$d/workspace/projects"
          cp tests/*.py "$d/tests/"
          cp memory/*.md "$d/memory/"
          printf '# A spec\n\nbody\n' > "$d/workspace/projects/demo-spec.md"

          # 1. Workspace-only tools must work with no skills reachable at all.
          (cd "$d" && env -u CLAUDE_PLUGIN_ROOT HOME=/nonexistent python3 tests/relevance_report.py) \
            || { echo "::error::relevance_report.py dies without skills — /tune-up calls it"; exit 1; }

          # 2. Skill-reading tools must resolve the plugin root when it's exported.
          (cd "$d" && CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE/plugins/product-manager-os" python3 tests/run_all.py > /dev/null) \
            || { echo "::error::run_all.py cannot find skills via CLAUDE_PLUGIN_ROOT"; exit 1; }
          (cd "$d" && CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE/plugins/product-manager-os" python3 tests/score_skill.py write-spec > /dev/null) \
            || { echo "::error::score_skill.py cannot resolve a bare skill name"; exit 1; }

          # 3. With nothing reachable, they must explain themselves, not traceback.
          out="$( (cd "$d" && env -u CLAUDE_PLUGIN_ROOT HOME=/nonexistent python3 tests/run_all.py) 2>&1 || true )"
          case "$out" in
            *Traceback*) echo "::error::run_all.py tracebacks instead of explaining"; echo "$out"; exit 1 ;;
            *"Could not find the skills"*) : ;;
            *) echo "::error::run_all.py gave no usable message"; echo "$out"; exit 1 ;;
          esac
          echo "shipped tools behave on a plugin install"
          rm -rf "$d"

      - name: Re-installing upgrades in place and never clobbers someone else's brief
        run: |
          # Re-running the installer to upgrade is the common case. It used to
          # leave two brains in the project — the old CLAUDE.md and an identical
          # CLAUDE-product-manager-os.md — both loaded, neither authoritative.
          set -e
          d="$(mktemp -d)"
          bash install.sh --target claude-code "$d" > /dev/null
          bash install.sh --target claude-code "$d" > /dev/null
          n=$(ls "$d"/CLAUDE*.md | wc -l | tr -d ' ')
          [ "$n" -eq 1 ] || { echo "::error::re-install left $n brain files, expected 1"; ls "$d"/CLAUDE*.md; exit 1; }

          # A brief that isn't ours must survive untouched, with the OS beside it.
          e="$(mktemp -d)"
          printf '# My own project brain\n' > "$e/CLAUDE.md"
          bash install.sh --target claude-code "$e" > /dev/null
          grep -q 'My own project brain' "$e/CLAUDE.md" || { echo "::error::clobbered the user's CLAUDE.md"; exit 1; }
          [ -f "$e/CLAUDE-product-manager-os.md" ] || { echo "::error::did not write the OS brain beside theirs"; exit 1; }

          # User content in memory/ is never overwritten.
          f="$(mktemp -d)"
          bash install.sh --target claude-code "$f" > /dev/null
          printf 'MY OWN NOTES\n' > "$f/memory/product.md"
          bash install.sh --target claude-code "$f" > /dev/null
          grep -q 'MY OWN NOTES' "$f/memory/product.md" || { echo "::error::re-install overwrote memory/"; exit 1; }
          echo "re-install is idempotent, non-destructive, and upgrades in place"
          rm -rf "$d" "$e" "$f"

      - name: Each bundle has its entry file, its skills, and no wrong-host branding
        working-directory: plugins/product-manager-os
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from build_targets import TARGETS
          bad = []
          for t, cfg in TARGETS.items():
              d = os.path.join('dist', t)
              entry = os.path.join(d, cfg['entry'])
              skills = os.path.join(d, cfg['skills_dir'])
              if not os.path.isfile(entry):
                  bad.append(f"{t}: missing {cfg['entry']}"); continue
              n = len([x for x in os.listdir(skills)
                       if os.path.isdir(os.path.join(skills, x))]) if os.path.isdir(skills) else 0
              if n == 0:
                  bad.append(f"{t}: no skills in {cfg['skills_dir']}")
              # a non-Claude bundle must not tell the user to talk to Claude
              if t not in ('claude-code', 'claude-cowork'):
                  txt = open(entry, encoding='utf-8').read()
                  if 'Claude Code' in txt:
                      bad.append(f"{t}: entry file still says 'Claude Code'")
              print(f"OK — {t}: {cfg['entry']}, {n} skills")
          if bad:
              raise SystemExit("\n".join(bad))
          PY
